name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar o projeto Xcode
        run: xcodegen generate

      - name: Compilar (sem assinatura)
        run: |
          xcodebuild \
            -project Yegen.xcodeproj \
            -scheme Yegen \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build/DerivedData

      - name: Empacotar o .ipa (sem assinatura)
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "App encontrado: $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Yegen-unsigned.ipa Payload
          ls -lh Yegen-unsigned.ipa

      - name: Subir o .ipa como artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yegen-unsigned-ipa
          path: Yegen-unsigned.ipa
          if-no-files-found: error
