name: Yegen
options:
  bundleIdPrefix: com.seidao
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  # Biblioteca do motor: parse de HTML + seletores CSS (equivalente ao
  # DOMParser/querySelector da versão web).
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: "2.6.0"
targets:
  Yegen:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/Yegen
    info:
      path: Sources/Yegen/Info.plist
    dependencies:
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seidao.yegen
        PRODUCT_NAME: Yegen
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"
        CODE_SIGN_STYLE: Manual
schemes:
  Yegen:
    build:
      targets:
        Yegen: all
    run:
      config: Debug
    archive:
      config: Release
