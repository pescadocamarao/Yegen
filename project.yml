name: Yegen
options:
  bundleIdPrefix: com.seidao
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  Yegen:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      # v1.3 — A CASCA: só compilam a raiz (YegenApp/ContentView) e a
      # casca (ShellWebView). As Views/Engine/Store do app nativo antigo
      # ficam FORA da compilação (os arquivos seguem no repo como
      # histórico). A página web embarcada (yegen-web.html) entra como
      # recurso do bundle.
      - path: Sources/Yegen
        excludes:
          - "CategoriesView.swift"
          - "DataFile.swift"
          - "DebugReport.swift"
          - "Engine.swift"
          - "GuideView.swift"
          - "HTMLKit.swift"
          - "InputsView.swift"
          - "JSONTabView.swift"
          - "JSONValue.swift"
          - "ListDetailViews.swift"
          - "Models.swift"
          - "SavedView.swift"
          - "Store.swift"
          - "Theme.swift"
    info:
      path: Sources/Yegen/Info.plist
      properties:
        CFBundleDevelopmentRegion: pt_BR
        CFBundleDisplayName: Yegen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
    # iCloud (v1.2): contêiner Documents pros Salvos + KV Store pras
    # preferências de aparência. O XcodeGen GERA o arquivo .entitlements a
    # partir destas properties (mesmo mecanismo do Info.plist). Na build
    # unsigned (CI) isto é inerte; nas rotas assinadas pode exigir a
    # capability iCloud habilitada no App ID (passo do usuário no portal).
    entitlements:
      path: Sources/Yegen/Yegen.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.seidao.yegen
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-kvstore-identifier: "$(TeamIdentifierPrefix)com.seidao.yegen"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seidao.yegen
        PRODUCT_NAME: Yegen
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.3.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Sources/Yegen/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: "YES"
        CODE_SIGN_STYLE: Manual
schemes:
  Yegen:
    build:
      targets:
        Yegen: all
    run:
      config: Debug
    archive:
      config: Release
